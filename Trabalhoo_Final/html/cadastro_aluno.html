  <main class="conteudo">
    <div>
      <!-- ===================================================
   FORMULÁRIO DE CADASTRO COM E-MAIL E SENHA
   =================================================== -->
      <form action="../php/cadastro_aluno.php" method="post">
        <h2>Formulário de Cadastro de Aluno</h2>

        <div class="grupo">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />
        </div>

        <div class="grupo">
          <label for="sobrenome">Sobrenome:</label>
          <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required />
        </div>

        <div class="grupo">
          <label for="idade">Idade:</label>
          <input type="number" id="idade" name="idade" placeholder="Digite sua idade" min="1" required />
        </div>
        <div class="grupo">
          <!-- CAMPO E-MAIL: Valida automaticamente o formato de e-mail no navegador -->
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="exemplo@email.com" required />
        </div>
        <div class="grupo">
          <!-- CAMPO SENHA: Oculta os caracteres digitados por segurança -->
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required />
        </div>
        <div class="botoes">
          <input type="submit" value="Salvar" />
          <input type="reset" value="Limpar" />
        </div>
      </form>
    </div>
  </main>

  <footer class="rodape">
    <p>POKEMON™</p>
  </footer>
